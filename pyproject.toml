[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hscida"
version = "0.5.1"
description = "HSCI data access provider"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "duckdb>=1.5.2",
    "hereutil>=0.1.5",
    "narwhals>=2.21.0",
    "pandas>=3.0.3",
    "pyarrow>=22.0.0",
    "polars>=1.40.1",
    "sqlframe[duckdb]>=4.2.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pytest>=8.4.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["hscida.py"]

[tool.hatch.build.targets.sdist]
only-include = [
    "/hscida.py",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
